[project]
name = "rawtrace-qc"
version = "0.1.0"
description = "Interactive HTML QC reports from Thermo .raw and Bruker .d mass spectrometry raw files"
readme = "README.md"
authors = [
    { name = "David M. Hollenstein", email = "hollenstein.david@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=14.0",
    "plotly>=6.0",
]

[project.optional-dependencies]
gui = [
    "pyside6>=6.8",
]

[project.scripts]
rawtrace-qc-gui = "rawtrace_qc.gui:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly==1.2.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["rawtrace_qc"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
extend-exclude = ["*.md"]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["rawtrace_qc"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
preset = "default"
python-version = "3.12"
project-includes = ["src/**/*.py"]
search-path = ["src"]
